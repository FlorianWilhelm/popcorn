<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff385c"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <linearGradient id="cornLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#facc15"/>
    </linearGradient>
    <linearGradient id="cornGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="60%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Popcorn Graphic on Transparent Canvas -->
  <g filter="url(#shadow)">
    <!-- Back popcorn puffs (Gold/Amber) -->
    <circle cx="36" cy="36" r="16" fill="url(#cornGold)" stroke="#92400e" stroke-width="2"/>
    <circle cx="92" cy="36" r="16" fill="url(#cornGold)" stroke="#92400e" stroke-width="2"/>
    <circle cx="64" cy="24" r="19" fill="url(#cornGold)" stroke="#92400e" stroke-width="2"/>
    <circle cx="22" cy="48" r="13" fill="url(#cornGold)" stroke="#92400e" stroke-width="2"/>
    <circle cx="106" cy="48" r="13" fill="url(#cornGold)" stroke="#92400e" stroke-width="2"/>

    <!-- Popping loose pieces floating -->
    <circle cx="16" cy="24" r="8" fill="url(#cornLight)" stroke="#ca8a04" stroke-width="1.8"/>
    <circle cx="112" cy="22" r="9" fill="url(#cornLight)" stroke="#ca8a04" stroke-width="1.8"/>
    <circle cx="64" cy="8" r="7" fill="url(#cornLight)" stroke="#ca8a04" stroke-width="1.8"/>

    <!-- Front Popcorn Puffs (Bright Butter Yellow) -->
    <circle cx="34" cy="46" r="17" fill="url(#cornLight)" stroke="#ca8a04" stroke-width="2"/>
    <circle cx="94" cy="46" r="17" fill="url(#cornLight)" stroke="#ca8a04" stroke-width="2"/>
    <circle cx="64" cy="40" r="21" fill="url(#cornLight)" stroke="#ca8a04" stroke-width="2"/>
    <circle cx="49" cy="50" r="16" fill="url(#cornLight)" stroke="#ca8a04" stroke-width="2"/>
    <circle cx="79" cy="50" r="16" fill="url(#cornLight)" stroke="#ca8a04" stroke-width="2"/>

    <!-- Kernel creases -->
    <path d="M 60 35 Q 64 42 68 35" stroke="#ca8a04" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M 31 43 Q 35 48 38 43" stroke="#ca8a04" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    <path d="M 90 43 Q 93 48 97 43" stroke="#ca8a04" stroke-width="2.2" fill="none" stroke-linecap="round"/>

    <!-- Popcorn Box / Bucket -->
    <g>
      <clipPath id="bucketClip">
        <path d="M 22 56 L 106 56 L 96 122 L 32 122 Z"/>
      </clipPath>
      
      <!-- Red Base with Dark Outline for Contrast -->
      <path d="M 22 56 L 106 56 L 96 122 L 32 122 Z" fill="url(#boxGrad)" stroke="#1e2029" stroke-width="3" stroke-linejoin="round"/>

      <!-- White Stripes -->
      <g clip-path="url(#bucketClip)">
        <polygon points="34,54 44,54 41,124 33,124" fill="#ffffff"/>
        <polygon points="54,54 64,54 60,124 52,124" fill="#ffffff"/>
        <polygon points="74,54 84,54 79,124 71,124" fill="#ffffff"/>
        <polygon points="94,54 104,54 98,124 90,124" fill="#ffffff"/>
      </g>

      <!-- Scalloped Top Edge -->
      <path d="M 20 56 Q 28 51 36 56 Q 50 51 64 56 Q 78 51 92 56 Q 100 51 108 56 L 106 60 L 22 60 Z" fill="#991b1b"/>

      <!-- Center Badge -->
      <circle cx="64" cy="88" r="17" fill="#ffffff" stroke="#e11d48" stroke-width="3"/>
      <!-- Letter P -->
      <path d="M 59 79 L 59 97 M 59 79 L 66 79 C 70.5 79 72.5 81.5 72.5 84.5 C 72.5 87.5 70.5 90 66 90 L 59 90" 
            stroke="#e11d48" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>
  </g>
</svg>