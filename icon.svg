<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Popcorn Box Red -->
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>

    <!-- Creamy Popcorn Gradient (Uniform across all kernels) -->
    <radialGradient id="popcornGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#fffdf0"/>
      <stop offset="85%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#fde047"/>
    </radialGradient>

    <!-- Subtle Back Kernel Shading -->
    <radialGradient id="popcornBackGrad" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="70%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#eab308"/>
    </radialGradient>

    <!-- Drop shadow -->
    <filter id="iconShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.3"/>
    </filter>
  </defs>

  <g filter="url(#iconShadow)">
    <!-- ================= 1. BACKGROUND POPCORN (Uniform scale, slightly shadowed) ================= -->
    <g fill="url(#popcornBackGrad)" stroke="#b45309" stroke-width="1.6" stroke-linejoin="round">
      <!-- Back Kernel Left (x:32, y:36) -->
      <path d="M 27 34 C 23 28, 33 24, 38 27 C 44 25, 46 33, 43 38 C 45 44, 35 46, 30 43 C 24 41, 24 37, 27 34 Z"/>
      <!-- Back Kernel Center-Left (x:50, y:26) -->
      <path d="M 45 24 C 41 18, 51 14, 56 18 C 62 15, 66 23, 63 28 C 64 34, 54 36, 49 33 C 43 31, 42 27, 45 24 Z"/>
      <!-- Back Kernel Center-Right (x:72, y:24) -->
      <path d="M 67 22 C 63 16, 74 12, 79 16 C 85 13, 89 21, 86 26 C 88 32, 77 35, 72 31 C 66 30, 64 25, 67 22 Z"/>
      <!-- Back Kernel Right (x:92, y:34) -->
      <path d="M 87 32 C 83 26, 93 22, 98 26 C 104 24, 107 32, 103 37 C 105 43, 95 45, 90 41 C 84 39, 84 35, 87 32 Z"/>
    </g>

    <!-- ================= 2. FOREGROUND POPCORN (Uniform creamy kernels with toasted centers) ================= -->
    <g fill="url(#popcornGrad)" stroke="#b45309" stroke-width="1.7" stroke-linejoin="round">
      <!-- Airborne Stray Kernel Left (x:18, y:20) -->
      <g>
        <path d="M 14 18 C 11 13, 19 10, 23 13 C 27 12, 29 18, 26 22 C 27 26, 20 28, 16 25 C 12 23, 12 20, 14 18 Z"/>
        <path d="M 19 18 Q 21 21 23 19" stroke="#b45309" stroke-width="1.2" fill="none" stroke-linecap="round"/>
      </g>

      <!-- Airborne Stray Kernel Right (x:108, y:18) -->
      <g>
        <path d="M 104 16 C 101 11, 109 8, 113 11 C 117 10, 119 16, 116 20 C 117 24, 110 26, 106 23 C 102 21, 102 18, 104 16 Z"/>
        <path d="M 109 16 Q 111 19 113 17" stroke="#b45309" stroke-width="1.2" fill="none" stroke-linecap="round"/>
      </g>

      <!-- Main Peak Kernel (x:62, y:32) -->
      <g>
        <path d="M 56 30 C 51 22, 63 18, 68 23 C 75 19, 80 27, 76 34 C 79 41, 68 45, 62 41 C 54 41, 52 35, 56 30 Z"/>
        <path d="M 64 30 Q 67 34 71 31" stroke="#b45309" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      </g>

      <!-- Mid Left Kernel (x:38, y:42) -->
      <g>
        <path d="M 32 40 C 27 33, 39 29, 44 34 C 50 31, 54 39, 51 45 C 53 52, 42 55, 37 51 C 30 49, 29 44, 32 40 Z"/>
        <path d="M 39 41 Q 42 45 46 42" stroke="#b45309" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      </g>

      <!-- Mid Right Kernel (x:84, y:40) -->
      <g>
        <path d="M 78 38 C 74 31, 85 27, 90 32 C 97 29, 100 37, 97 43 C 99 50, 89 53, 84 49 C 77 47, 76 42, 78 38 Z"/>
        <path d="M 86 39 Q 89 43 93 40" stroke="#b45309" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      </g>

      <!-- Front Overhang Kernel Left (x:48, y:52) -->
      <g>
        <path d="M 42 50 C 37 43, 49 39, 54 44 C 60 41, 64 49, 61 55 C 63 62, 52 65, 47 61 C 40 59, 39 54, 42 50 Z"/>
        <path d="M 49 51 Q 52 55 56 52" stroke="#b45309" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      </g>

      <!-- Front Overhang Kernel Right (x:72, y:52) -->
      <g>
        <path d="M 66 50 C 62 43, 73 39, 78 44 C 85 42, 88 49, 85 55 C 87 62, 77 65, 72 61 C 65 59, 64 54, 66 50 Z"/>
        <path d="M 74 51 Q 77 55 81 52" stroke="#b45309" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      </g>

      <!-- Left Rim Spillover (x:24, y:54) -->
      <g>
        <path d="M 18 52 C 14 46, 25 42, 29 47 C 34 45, 37 52, 34 57 C 35 63, 26 66, 22 62 C 16 60, 16 56, 18 52 Z"/>
        <path d="M 24 53 Q 27 57 30 54" stroke="#b45309" stroke-width="1.3" fill="none" stroke-linecap="round"/>
      </g>

      <!-- Right Rim Spillover (x:98, y:54) -->
      <g>
        <path d="M 92 52 C 88 46, 99 42, 103 47 C 109 45, 112 52, 109 57 C 110 63, 101 66, 97 62 C 91 60, 91 56, 92 52 Z"/>
        <path d="M 99 53 Q 102 57 105 54" stroke="#b45309" stroke-width="1.3" fill="none" stroke-linecap="round"/>
      </g>
    </g>

    <!-- ================= 3. POPCORN BUCKET / BOX ================= -->
    <g>
      <!-- Clip path for the tapered bucket -->
      <clipPath id="bucketClip">
        <path d="M 24 58 L 104 58 L 94 122 L 34 122 Z"/>
      </clipPath>

      <!-- Bucket Body with crisp dark-slate outline -->
      <path d="M 24 58 L 104 58 L 94 122 L 34 122 Z" fill="url(#redGrad)" stroke="#1e293b" stroke-width="2.5" stroke-linejoin="round"/>

      <!-- Clean Red & White Stripes -->
      <g clip-path="url(#bucketClip)">
        <polygon points="36,54 48,54 44,124 34,124" fill="#ffffff"/>
        <polygon points="58,54 70,54 66,124 56,124" fill="#ffffff"/>
        <polygon points="80,54 92,54 87,124 78,124" fill="#ffffff"/>
      </g>

      <!-- Bucket Top Trim -->
      <path d="M 22 58 L 106 58 L 104 62 L 24 62 Z" fill="#991b1b"/>

      <!-- Circular Center Badge -->
      <g transform="translate(64, 88)">
        <!-- Outer white disk -->
        <circle cx="0" cy="0" r="17" fill="#ffffff" stroke="#dc2626" stroke-width="2.8"/>
        <!-- Inner accent ring -->
        <circle cx="0" cy="0" r="13.5" fill="#fff1f2" stroke="#f87171" stroke-width="1" stroke-dasharray="2 1.5"/>

        <!-- Popcorn Letter "P" -->
        <path d="M -4 -7.5 L -4 7.5 M -4 -7.5 L 2.5 -7.5 C 6 -7.5 7.8 -5.5 7.8 -2.5 C 7.8 0.5 6 2.5 2.5 2.5 L -4 2.5" 
              stroke="#dc2626" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </g>
    </g>
  </g>
</svg>