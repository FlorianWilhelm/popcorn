<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Box gradient -->
    <linearGradient id="redStripe" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff334b"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <linearGradient id="whiteStripe" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>

    <!-- Butter / Popcorn gradients -->
    <radialGradient id="butterCore" cx="45%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#fffef0"/>
      <stop offset="35%" stop-color="#fef08a"/>
      <stop offset="75%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </radialGradient>

    <radialGradient id="butterLight" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#fffbeb"/>
      <stop offset="85%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </radialGradient>

    <radialGradient id="butterDark" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="60%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </radialGradient>

    <!-- Drop shadow -->
    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#090a0f" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g filter="url(#softShadow)">
    <!-- ================= BACK LAYER: SHADOW POPCORN PIECES ================= -->
    <!-- Back Piece Left -->
    <g stroke="#92400e" stroke-width="1.8" stroke-linejoin="round" fill="url(#butterDark)">
      <circle cx="22" cy="36" r="10"/>
      <circle cx="32" cy="33" r="9"/>
      <circle cx="28" cy="44" r="9"/>
      <circle cx="20" cy="43" r="8"/>
    </g>

    <!-- Back Piece Top Center-Left -->
    <g stroke="#92400e" stroke-width="1.8" stroke-linejoin="round" fill="url(#butterDark)">
      <circle cx="44" cy="22" r="11"/>
      <circle cx="55" cy="18" r="10"/>
      <circle cx="57" cy="28" r="9.5"/>
      <circle cx="46" cy="29" r="9.5"/>
    </g>

    <!-- Back Piece Top Right Peak -->
    <g stroke="#92400e" stroke-width="1.8" stroke-linejoin="round" fill="url(#butterDark)">
      <circle cx="76" cy="23" r="11"/>
      <circle cx="88" cy="19" r="11"/>
      <circle cx="91" cy="29" r="10"/>
      <circle cx="81" cy="32" r="9.5"/>
    </g>

    <!-- Back Piece Far Right Overflow -->
    <g stroke="#92400e" stroke-width="1.8" stroke-linejoin="round" fill="url(#butterDark)">
      <circle cx="97" cy="37" r="9"/>
      <circle cx="106" cy="39" r="8.5"/>
      <circle cx="104" cy="47" r="9"/>
      <circle cx="96" cy="45" r="8"/>
    </g>

    <!-- ================= STRAY FLYING KERNELS (ASYMMETRIC) ================= -->
    <!-- High flying kernel on left -->
    <g stroke="#ca8a04" stroke-width="1.8" fill="url(#butterLight)">
      <circle cx="15" cy="17" r="6.5"/>
      <circle cx="23" cy="15" r="5.5"/>
      <circle cx="19" cy="23" r="6"/>
    </g>

    <!-- Tiny popped bit top center -->
    <g stroke="#ca8a04" stroke-width="1.6" fill="url(#butterLight)">
      <circle cx="61" cy="8" r="5.5"/>
      <circle cx="68" cy="7" r="5"/>
      <circle cx="65" cy="13" r="5.2"/>
    </g>

    <!-- Flying kernel on right -->
    <g stroke="#ca8a04" stroke-width="1.8" fill="url(#butterLight)">
      <circle cx="107" cy="17" r="6.5"/>
      <circle cx="115" cy="18" r="6"/>
      <circle cx="111" cy="24" r="6.2"/>
    </g>

    <!-- ================= MIDDLE & FRONT POPCORN HEAP ================= -->
    <!-- Mid Left Cluster -->
    <g stroke="#ca8a04" stroke-width="1.8" stroke-linejoin="round" fill="url(#butterLight)">
      <circle cx="30" cy="44" r="13"/>
      <circle cx="44" cy="40" r="12"/>
      <circle cx="45" cy="52" r="11.5"/>
      <circle cx="31" cy="53" r="11"/>
    </g>

    <!-- Hero Main Peak Center-Right -->
    <g stroke="#ca8a04" stroke-width="1.8" stroke-linejoin="round" fill="url(#butterLight)">
      <circle cx="57" cy="31" r="14.5"/>
      <circle cx="74" cy="27" r="15"/>
      <circle cx="79" cy="41" r="13.5"/>
      <circle cx="61" cy="42" r="13.5"/>
      <!-- Inner Golden Butter Core -->
      <ellipse cx="68" cy="33" rx="8" ry="7" fill="url(#butterCore)" stroke="none"/>
    </g>

    <!-- Mid Right Cluster -->
    <g stroke="#ca8a04" stroke-width="1.8" stroke-linejoin="round" fill="url(#butterLight)">
      <circle cx="83" cy="41" r="12.5"/>
      <circle cx="97" cy="40" r="12"/>
      <circle cx="98" cy="51" r="11"/>
      <circle cx="85" cy="51" r="10.5"/>
    </g>

    <!-- Front Left Overhang -->
    <g stroke="#ca8a04" stroke-width="1.8" stroke-linejoin="round" fill="url(#butterLight)">
      <circle cx="40" cy="53" r="12"/>
      <circle cx="55" cy="49" r="13"/>
      <circle cx="57" cy="60" r="11"/>
      <circle cx="43" cy="61" r="11"/>
      <circle cx="48" cy="55" r="6" fill="url(#butterCore)" stroke="none"/>
    </g>

    <!-- Front Right Overhang -->
    <g stroke="#ca8a04" stroke-width="1.8" stroke-linejoin="round" fill="url(#butterLight)">
      <circle cx="67" cy="54" r="11.5"/>
      <circle cx="81" cy="51" r="12"/>
      <circle cx="82" cy="61" r="10.5"/>
      <circle cx="69" cy="61" r="10.5"/>
    </g>

    <!-- Spillover Far Left -->
    <g stroke="#ca8a04" stroke-width="1.8" stroke-linejoin="round" fill="url(#butterLight)">
      <circle cx="19" cy="55" r="9"/>
      <circle cx="28" cy="53" r="8.5"/>
      <circle cx="27" cy="62" r="8"/>
      <circle cx="18" cy="62" r="7.5"/>
    </g>

    <!-- Spillover Far Right -->
    <g stroke="#ca8a04" stroke-width="1.8" stroke-linejoin="round" fill="url(#butterLight)">
      <circle cx="95" cy="58" r="8.5"/>
      <circle cx="104" cy="57" r="8"/>
      <circle cx="103" cy="66" r="7.5"/>
      <circle cx="95" cy="65" r="7"/>
    </g>

    <!-- ================= POPCORN BUCKET / BOX ================= -->
    <g>
      <!-- Bucket Clip Path for Stripes -->
      <clipPath id="bucketBodyClip">
        <path d="M 24 58 L 104 58 L 94 122 L 34 122 Z"/>
      </clipPath>

      <!-- Red Bucket Body with dark outline -->
      <path d="M 24 58 L 104 58 L 94 122 L 34 122 Z" fill="url(#redStripe)" stroke="#1e2029" stroke-width="3" stroke-linejoin="round"/>

      <!-- Red & White Vertical Stripes -->
      <g clip-path="url(#bucketBodyClip)">
        <polygon points="36,54 47,54 44,124 35,124" fill="url(#whiteStripe)"/>
        <polygon points="58,54 70,54 66,124 56,124" fill="url(#whiteStripe)"/>
        <polygon points="81,54 92,54 87,124 78,124" fill="url(#whiteStripe)"/>
      </g>

      <!-- Irregular Scalloped/Wavy Top Rim -->
      <path d="M 22 58 Q 32 53 42 58 Q 54 52 66 57 Q 80 52 92 57 Q 99 53 106 58 L 104 62 L 24 62 Z" fill="#9f1239"/>

      <!-- Circular POPCORN Badge -->
      <g transform="translate(64, 88)">
        <!-- Outer White Glow & Ring -->
        <circle cx="0" cy="0" r="17.5" fill="#ffffff" stroke="#be123c" stroke-width="2.8"/>
        <!-- Inner Decorative Ring -->
        <circle cx="0" cy="0" r="14" fill="#fff1f2" stroke="#f43f5e" stroke-width="1" stroke-dasharray="2.5 1.5"/>

        <!-- Bold Popcorn-Style "P" -->
        <path d="M -4.5 -8 L -4.5 8 M -4.5 -8 L 2.5 -8 C 6.5 -8 8.5 -5.8 8.5 -2.5 C 8.5 0.8 6.5 3 2.5 3 L -4.5 3" 
              stroke="#be123c" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </g>
    </g>
  </g>
</svg>